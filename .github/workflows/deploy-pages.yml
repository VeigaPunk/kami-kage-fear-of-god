# Deploy the editorial site to GitHub Pages (gh-pages branch).
# Nitro's github_pages preset is incompatible with TanStack Start here, so we
# SSR-snapshot into static files and push them to the gh-pages branch.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Lockfile is generated by npm 11 (Node 24); npm 10 (Node 22) fails
          # `npm ci` on unstorage's optional lru-cache peer ("Missing from lock").
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify (typecheck + lint + format)
        run: |
          npm run typecheck
          npm run lint
          npx prettier --check .

      - name: Build static Pages site
        run: npm run build:pages

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          force_orphan: true
          cname: ""
